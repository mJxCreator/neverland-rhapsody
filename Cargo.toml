[package]
name = "neverland-rhapsody"
version = "0.1.0"
edition = "2021"
description = "A Rust-based voxel sandbox engine"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.2"
noise = "0.9"
pollster = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30"
